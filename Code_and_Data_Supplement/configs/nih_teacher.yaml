project:
  output_dir: outputs/nih_teacher

data:
  image_root: /path/to/NIH_PULSE/images-224
  split_dir: /path/to/patient_splits_70_10_10_5_5
  retain_file: retain_train.csv
  forget_file: forget_train.csv
  validation_file: internal_validation.csv
  image_column: Image Index
  patient_column: Patient ID
  labels: [Atelectasis, Cardiomegaly, Effusion, Infiltration, Mass, Nodule, Pneumonia, Pneumothorax, Consolidation, Edema, Emphysema, Fibrosis, Pleural_Thickening, Hernia]

model:
  backbone: microsoft/rad-dino-maira-2
  input_size: 224
  embedding_dim: 256
  trainable_last_blocks: 2

training:
  seed: 42
  epochs: 6
  batch_size: 32
  learning_rate: 0.000007
  weight_decay: 0.0001
  patient_loss_weight: 1.5
  gradient_clip: 1.0
  mixed_precision: true
