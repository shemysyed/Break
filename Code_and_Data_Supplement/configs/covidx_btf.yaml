project:
  name: pulse_covidx
  output_dir: outputs/covidx
  cache_dir: cache/covidx
data:
  image_root: /path/to/COVIDx
  split_dir: data_splits/covidx
  split_files:
    retain: retain_train.csv
    forget: forget_train.csv
    audit: audit_nonmember_trainlike.csv
    validation: internal_validation.csv
    test: official_test.csv
    external_validation: official_validation.csv
  image_column: ImageID
  patient_column: PatientID
  path_column: image_path
  label_column: label_id
  labels:
  - COVIDx_binary
  expected_counts:
    retain:
      images: 47823
      patients: 24870
    forget:
      images: 6703
      patients: 3529
    audit:
      images: 6604
      patients: 3529
    validation:
      images: 6733
      patients: 3529
    external_validation:
      images: 8473
      patients: 5163
    test:
      images: 8482
      patients: 4722
model:
  backbone: microsoft/rad-dino-maira-2
  input_size: 224
  embedding_dim: 256
  bottleneck_dim: 32
  identity_subspace_dim: 96
  trainable_last_blocks: 2
inference:
  alpha: 0.7
  beta: 0.631997
  noise_scale: 0.0
evaluation:
  seed: 1212
  pair_count: 50000
  pair_score_direction: raw_cosine_no_inversion
  pair_seed: 1229
  retrieval_chunk_size: 256
  teacher_map_at_r: 0.118
