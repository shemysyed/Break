shared:
  seed: 42
  epochs: 5
  steps_per_epoch: 500
  batch_size: 6
  learning_rate: 0.000001
  weight_decay: 0.0001
  gradient_clip: 1.0
  trainable_last_blocks: 2
  retain_bce_weight: 1.0
  retain_kd_weight: 2.0
  forget_weight: 0.25
  verifier_weight: 1.0
methods:
  standard_retrain: {initialization: foundation, use_forget: false}
  retain_ft: {initialization: teacher, use_forget: false}
  neggrad_plus: {initialization: teacher, negative_forget_gradient: true}
  forget_mi: {initialization: teacher, forget_representation_confusion: true}
  bad_teaching: {initialization: teacher, incompetent_teacher: shuffled_logits}
  scrub: {initialization: teacher, forget_divergence: true}
  salun: {initialization: teacher, saliency_fraction: 0.20}
  privacy_retrain: {initialization: foundation, use_forget: false, patient_linkage_suppression: true}
