[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-unlearning"
version = "0.1.0"
description = "Anonymous AAAI-27 code supplement for PULSE patient-level unlearning"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.0.2",
  "pandas==2.2.2",
  "Pillow==11.3.0",
  "scikit-learn==1.6.1",
  "PyYAML>=6.0.2",
  "tqdm>=4.66",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "transformers==5.13.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
